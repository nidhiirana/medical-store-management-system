{% extends ('base.html' if current_user else 'plain.html') %}
{% block title %}{{ title }}{% endblock %}
{% block content %}{{ self.err() }}{% endblock %}
{% block body %}<div class="container py-5">{{ self.err() }}</div>{% endblock %}
{% block err %}
<div class="text-center py-5"><div class="display-1 fw-bold text-muted">{{ code }}</div><h2>{{ title }}</h2>
<p class="text-muted">{{ message }}</p>
<a class="btn btn-brand" href="{{ url_for('dashboard') }}">Back to dashboard</a></div>
{% endblock %}
