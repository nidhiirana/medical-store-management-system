{% extends 'base.html' %}
{% block title %}{{ 'Edit' if med else 'Add' }} Medicine{% endblock %}
{% block content %}
<div class="card" style="max-width:820px"><div class="card-body">
<form method="post" class="row g-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
 <div class="col-md-8"><label class="form-label">Medicine name *</label><input class="form-control" name="name" value="{{ form.name or '' }}" required maxlength="120"></div>
 <div class="col-md-4"><label class="form-label">Batch number *</label><input class="form-control" name="batch_no" value="{{ form.batch_no or '' }}" required maxlength="50"></div>
 <div class="col-md-4"><label class="form-label">Category</label><input class="form-control" name="category" list="cats" value="{{ form.category or '' }}">
  <datalist id="cats">{% for c in categories %}<option value="{{ c }}">{% endfor %}</datalist></div>
 <div class="col-md-4"><label class="form-label">Price (₹) *</label><input class="form-control" type="number" step="0.01" min="0" name="price" value="{{ form.price if form.price is not none else '' }}" required></div>
 <div class="col-md-4"><label class="form-label">Quantity *</label><input class="form-control" type="number" min="0" name="quantity" value="{{ form.quantity if form.quantity is not none else '' }}" required></div>
 <div class="col-md-4"><label class="form-label">Reorder level</label><input class="form-control" type="number" min="0" name="reorder_level" value="{{ form.reorder_level if form.reorder_level is not none else 10 }}"></div>
 <div class="col-md-4"><label class="form-label">Expiry date *</label><input class="form-control" type="date" name="expiry_date" value="{{ form.expiry_date or '' }}" required></div>
 <div class="col-md-4"><label class="form-label">Supplier</label><select class="form-select" name="supplier_id"><option value="">— none —</option>
  {% for s in suppliers %}<option value="{{ s.id }}" {{ 'selected' if form.supplier_id|string == s.id|string }}>{{ s.name }}</option>{% endfor %}</select></div>
 <div class="col-12"><button class="btn btn-brand">Save</button> <a class="btn btn-outline-secondary" href="{{ url_for('medicines') }}">Cancel</a></div>
</form></div></div>
{% endblock %}
