{% extends 'base.html' %}
{% block title %}{{ 'Edit' if sup else 'Add' }} Supplier{% endblock %}
{% block content %}
<div class="card" style="max-width:700px"><div class="card-body"><form method="post" class="row g-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
 <div class="col-12"><label class="form-label">Supplier name *</label><input class="form-control" name="name" value="{{ form.name or '' }}" required></div>
 <div class="col-md-6"><label class="form-label">Contact number *</label><input class="form-control" name="contact" value="{{ form.contact or '' }}" required></div>
 <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ form.email or '' }}"></div>
 <div class="col-12"><label class="form-label">Address</label><textarea class="form-control" rows="2" name="address">{{ form.address or '' }}</textarea></div>
 <div class="col-12"><button class="btn btn-brand">Save</button> <a class="btn btn-outline-secondary" href="{{ url_for('suppliers') }}">Cancel</a></div></form></div></div>
{% endblock %}
